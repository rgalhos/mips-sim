name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup redirect
        env:
          CI: false
        run: |
          mkdir -p ./build
          cat << 'EOF' > ./build/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Redirecting...</title>
              <link rel="canonical" href="https://rv-sim.rgalhos.dev/">
              <meta http-equiv="refresh" content="0; url=https://rv-sim.rgalhos.dev/">
            </head>
            <body>
              <p>If you are not redirected automatically, follow this <a href="https://rv-sim.rgalhos.dev/">link to the new page</a>.</p>
            </body>
          </html>
          EOF


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
